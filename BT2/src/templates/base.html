<!-- Khung chung cho mọi trang đã đăng nhập: thanh trên + thông báo flash -->
<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Hệ thống quản lý phiếu bảo hành - tiếp nhận, phân công và theo dõi xử lý.">
  <title>{% block title %}{% endblock %} · Quản lý bảo hành</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🛠</span> Quản lý phiếu bảo hành</div>
    <div class="userbox">
      <span>{{ session.full_name }}</span>
      <span class="role-chip">{{ ROLE_LABELS[session.role] }}</span>
      <a class="btn small ghost" id="btn-logout" href="{{ url_for('logout') }}">Đăng xuất</a>
    </div>
  </header>
  <main>
    <!-- Hiển thị các thông báo thành công / lỗi từ flash() -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
